name: tests

# Tier 0 only. `tests/` is pure-function coverage of the variance math, the
# cohort slicer, the AP control rules and the memory graph -- it builds its own
# in-memory DuckDB/SQLite fixtures, so it needs no seeded data files, no model
# endpoint and no secrets.
#
# Tier 1 (`evals/run_evals.py`) is deliberately NOT wired in here: it requires
# `python data/seed_flux.py` to have generated the 20-month dataset first, and
# it replays the whole LangGraph pipeline. Run it locally, or add a separate
# job that seeds the data if it should gate merges.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tier0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ui/ has no test coverage -- it needs a browser -- so a NameError from a
      # refactor there reaches production silently: py_compile does not resolve
      # global names, and pytest never imports the Streamlit page. That is
      # exactly how a broken _render_findings_section shipped. F821 catches it
      # statically, in the one place that would have caught it for free.
      - name: Lint for undefined and duplicate names
        run: ruff check --select F821,F811 app ui tests evals data modal_app run_flux.py run_demo.py

      - name: Run Tier 0 tests
        run: pytest tests -q
