# Frozen expectations for the variance-explanation agent's deterministic path.
#
# TRANSCRIBED, NOT IMPORTED -- deliberately.
#
# Every value below was read off `data/seed_flux.py` by hand and copied here as
# a literal. Nothing in `evals/` imports that module. If the eval derived its
# expectations from the generator, the generator could drift (a new planted
# story, a changed amount, a different RNG seed) and the eval would happily
# re-derive whatever the new truth was and keep reporting green. Transcribing
# means a drifting generator breaks this file loudly, which is the entire point
# of having a labelled set.
#
# Two kinds of number live here, and they are asserted differently:
#
#   * PLANTED amounts (the flagship enterprise revenue table, the 25,000
#     TechConf sponsorship, the 40,000 legal fee, the 8/11/15k hosting
#     overruns). These overwrite the
#     RNG series in the generator, so they are exact and are asserted exactly.
#
#   * BASE series (`smooth_series`, +/-3-5% uniform noise on every period of
#     every account). Anything derived from these carries a tolerance -- see
#     `meta.tolerance_pct`. Account-level deltas that mix a planted amount with
#     a noised base are treated as tolerant, not exact.
#
# Where a story's materiality genuinely cannot be predicted by reading (a
# planted move small enough that the base noise decides the outcome), the entry
# says `material: null` and the eval reports the observed value instead of
# asserting one. Those are marked `report_only: true` with a reason.

meta:
  generator: data/seed_flux.py
  rng_seed: 20260905
  first_period: "2025-01"
  last_period: "2026-08"
  period_count: 20
  # Fractional tolerance applied to any expectation derived from a noised
  # base series. Planted amounts ignore it.
  tolerance_pct: 0.01
  # Dollar tolerance for comparing two independent computations of the same
  # figure (DuckDB SUM vs a plain-Python CSV recomputation).
  recompute_tolerance_abs: 0.01
  # Thresholds this file assumes, from app/config.py. The eval asserts these
  # still hold before scoring anything -- an expectation like "the flagship is
  # material by the absolute threshold" is only meaningful against a known gate.
  config:
    MATERIALITY_ABS: 25000.0
    MATERIALITY_PCT: 0.10
    MATERIALITY_FLOOR: 5000.0
    ANOMALY_Z: 2.0
    MAX_DRILLDOWNS: 6
    MAX_DRIVERS: 5

stories:

  # -------------------------------------------------------------------------
  - id: enterprise_flagship
    label: "Enterprise revenue jumps 32% on three customers"
    source: "seed_flux.py ENTERPRISE_FLAGSHIP, IDX_FLAGSHIP_PRIOR/CURRENT"
    account_code: "4000"
    period: "2026-08"
    prior_period: "2026-07"
    material: true
    materiality_reason: absolute-threshold
    # Planted: the whole account total on both sides is the sum of the
    # ENTERPRISE_FLAGSHIP table, so these are exact, not tolerant.
    exact:
      prior_amt: 300000.00
      current_amt: 396000.00
      delta: 96000.00
      pct: 0.32
    # Per-customer deltas, current minus prior, straight off the two dicts.
    driver_deltas:
      ENT-01: 30000.00   # Globex Corp     70,000 -> 100,000
      ENT-02: 20000.00   # Initech Holdings 65,000 ->  85,000
      ENT-04: 18000.00   # Stark Industries 55,000 ->  73,000
      ENT-05: 15000.00   # Wayne Enterprises 50,000 -> 65,000
      ENT-03: 13000.00   # Umbrella Group   60,000 ->  73,000
    top_1: ENT-01
    top_3: [ENT-01, ENT-02, ENT-04]
    all_driver_cohorts: expansion
    # 0.3125 + 0.208333 + 0.1875 = 0.708333 -> rounded to 4dp = 0.7083 ->
    # formatted with "{:.0f}" = 71. Cap of 3 in graph.py:_concentration_note.
    concentration_note: "3 customers account for 71% of this account's delta"

  # -------------------------------------------------------------------------
  - id: hosting_overrun_first_month
    label: "CloudBeam Compute elastic-burst overrun appears"
    source: "seed_flux.py hosting_overrun[IDX['2026-06']] = 8_000"
    account_code: "5000"
    period: "2026-06"
    prior_period: "2026-05"
    # 8,000 on a ~40.7k base: below MATERIALITY_ABS, but comfortably past both
    # MATERIALITY_FLOOR (5,000) and MATERIALITY_PCT (10%) even at the extremes
    # of the +/-3% base noise, so the gate outcome IS predictable by reading.
    material: true
    materiality_reason: percentage-threshold
    driver_deltas:
      CloudBeam Compute: 8000.00   # planted: 0 in 2026-05, 8,000 in 2026-06
    top_1: "CloudBeam Compute"
    driver_cohorts:
      CloudBeam Compute: new

  - id: hosting_overrun_continuation
    label: "CloudBeam overrun grows 8k -> 11k -> 15k"
    source: "seed_flux.py hosting_overrun (2026-06/07/08)"
    account_code: "5000"
    report_only: true
    report_only_reason: >-
      The month-over-month CHANGE in the overrun is only +3,000 (July) and
      +4,000 (August), which is inside the swing the +/-3% noise on the ~41k
      hosting base can produce on its own. Whether account 5000 clears the
      materiality gate in those two periods cannot be determined by reading the
      generator, and the z-score gate depends on the trailing distribution.
      The eval reports what happened rather than asserting an outcome.
    periods: ["2026-07", "2026-08"]
    driver_deltas:
      # These per-vendor deltas ARE exact (planted); only the account-level
      # materiality outcome is unknown.
      "2026-07": {CloudBeam Compute: 3000.00}
      "2026-08": {CloudBeam Compute: 4000.00}

  # -------------------------------------------------------------------------
  - id: seasonal_conference_2025
    label: "TechConf Expo sponsorship hits S&M (first August)"
    source: "seed_flux.py conference_sponsorship = 25_000, IDX_CONFERENCE[0]"
    account_code: "6000"
    period: "2025-08"
    prior_period: "2025-07"
    material: true
    # 25,000 planted on a ~68k base whose noise (+/-4-5%) can push the account
    # delta either side of the 25,000 absolute gate; the percentage gate
    # (35% of 68k, well past the 5k floor) catches it regardless. So the fact
    # of materiality is certain, the winning gate is not.
    materiality_reason_any_of: [absolute-threshold, percentage-threshold]
    driver_deltas:
      TechConf Expo: 25000.00
    top_1: "TechConf Expo"
    driver_cohorts:
      TechConf Expo: new

  - id: seasonal_conference_2026
    label: "TechConf Expo sponsorship recurs a year later"
    source: "seed_flux.py IDX_CONFERENCE[1]"
    account_code: "6000"
    period: "2026-08"
    prior_period: "2026-07"
    material: true
    materiality_reason_any_of: [absolute-threshold, percentage-threshold]
    driver_deltas:
      TechConf Expo: 25000.00
    top_1: "TechConf Expo"
    driver_cohorts:
      TechConf Expo: new
    # After a full oldest-first replay, memory must read this as seasonal:
    # seen in a prior run, but not in the immediately preceding period.
    memory:
      edge: "6000::TechConf Expo"
      before_period: "2026-08"
      seen_before: true
      streak: 0

  # -------------------------------------------------------------------------
  - id: midmarket_churn
    label: "Fabrikam Mid churns out of Mid-Market revenue"
    source: "seed_flux.py IDX_CHURN_START, midmarket_series['MID-04'] = 0.0 onward"
    account_code: "4010"
    period: "2026-03"
    prior_period: "2026-02"
    material: true
    # MID-04's base is drawn from (28_000, 36_000), so the lost revenue is at
    # least ~28k -- past the absolute gate -- but the other four customers'
    # noise rides on top, so the winning gate is not certain by reading.
    materiality_reason_any_of: [absolute-threshold, percentage-threshold]
    top_1: MID-04
    driver_cohorts:
      MID-04: churned
    driver_delta_sign:
      MID-04: negative
    # The generator zeroes MID-04 from 2026-03 through the end, and slicer's
    # HAVING clause drops a member with no money on either side, so it must
    # never appear as a driver again.
    absent_as_driver_after: "2026-03"

  # -------------------------------------------------------------------------
  - id: legal_fee_one_off
    label: "One-off M&A legal fee spikes G&A"
    source: "seed_flux.py legal_fee = 40_000, IDX_LEGAL_FEE = 2025-11"
    account_code: "6010"
    period: "2025-11"
    prior_period: "2025-10"
    material: true
    # 40,000 planted on a ~49k base with +/-3% noise: the account delta cannot
    # fall below ~37k, so the absolute gate always wins here.
    materiality_reason: absolute-threshold
    driver_deltas:
      Latham Legal Advisors: 40000.00
    top_1: "Latham Legal Advisors"
    driver_cohorts:
      Latham Legal Advisors: new
    # It reverses out in 2025-12 (churned, -40,000) and never recurs.
    absent_as_driver_after: "2025-12"

# Comparisons in which NO story above was planted. Any finding the agent
# produces in one of these is a candidate false positive -- "candidate", not
# "confirmed", because the base series are genuinely noised and a real 12%
# swing in R&D is a real variance, not a hallucination. The eval reports the
# rate and lists the accounts; it does not assert a ceiling, because nobody has
# ever measured this number and inventing a threshold here would be dishonest.
false_positive_policy:
  assert_max_rate: null
  # Comparisons that DO carry a planted story (including the reversal months,
  # where the planted amount drops back out and legitimately shows up again).
  story_comparisons:
    - {period: "2025-08", account_code: "6000"}   # conference in
    - {period: "2025-09", account_code: "6000"}   # conference out
    - {period: "2025-11", account_code: "6010"}   # legal fee in
    - {period: "2025-12", account_code: "6010"}   # legal fee out
    - {period: "2026-03", account_code: "4010"}   # Fabrikam churn
    - {period: "2026-06", account_code: "5000"}   # hosting overrun starts
    - {period: "2026-07", account_code: "5000"}   # overrun grows
    - {period: "2026-08", account_code: "5000"}   # overrun grows
    - {period: "2026-08", account_code: "4000"}   # flagship
    - {period: "2026-08", account_code: "6000"}   # conference recurs
